<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New England Contech-for-Cleantech Audit 2026</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>

  <!-- ── Top bar ──────────────────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-title">New England Contech-for-Cleantech</span>
      <span class="topbar-sub">2026 Audit · Independent update of NREL/CP-5500-83262</span>
    </div>
    <div class="topbar-right">
      <button id="btn-download" class="btn-dl">⬇ Download CSV</button>
      <a href="https://www.nrel.gov/docs/fy22osti/83262.pdf" target="_blank" class="btn-paper">2022 Paper ↗</a>
    </div>
  </header>

  <!-- ── Map ──────────────────────────────────────────────────────────────── -->
  <div id="map"></div>

  <!-- ── Legend ───────────────────────────────────────────────────────────── -->
  <div class="legend">
    <div class="legend-title">Composite score<br><span class="legend-sub">(Gov + Industry roles)</span></div>
    <div class="legend-row"><span class="swatch" style="background:#166534"></span> Strong (4)</div>
    <div class="legend-row"><span class="swatch" style="background:#22c55e"></span> Good (3)</div>
    <div class="legend-row"><span class="swatch" style="background:#f59e0b"></span> Partial (2)</div>
    <div class="legend-row"><span class="swatch" style="background:#ef4444"></span> Weak (1)</div>
    <div class="legend-row"><span class="swatch" style="background:#94a3b8"></span> Absent (0)</div>
    <hr/>
    <div class="legend-note">Philanthropy = universally absent across NE</div>
  </div>

  <!-- ── Detail panel ─────────────────────────────────────────────────────── -->
  <div id="panel" class="panel"></div>

  <!-- ── Inject token + load map ──────────────────────────────────────────── -->
  <script>
    // MAPBOX_TOKEN is injected by Vercel environment variable at build time.
    // For local dev, set MAPBOX_TOKEN in .env and Vite will replace it.
    window.MAPBOX_TOKEN = '__MAPBOX_TOKEN__';
  </script>
  <script type="module" src="src/map.js"></script>
</body>
</html>
